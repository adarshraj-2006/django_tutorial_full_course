{% extends "base.html" %}

{% block content %}
  <h1>Delete Note</h1>
  <p>Are you sure you want to delete the note "{{ note.title }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class ="btn btn-danger">Confirm Delete</button>
  </form>
  <a href="{% url 'notes.detail' note.id %}" class="btn btn-secondary">Cancel</a>
{% endblock %}
