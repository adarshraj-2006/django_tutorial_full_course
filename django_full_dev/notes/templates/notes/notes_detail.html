        <div class="col-md-8 col-lg-7">

            

                <div class="card-body p-4 p-md-5">

                    <h1 class="card-title fw-bold mb-4 text-primary">
                        {{ note.title }}

                    <div class="border-top pt-4">

                    <div class="mt-4">

        </div>
    </div>
