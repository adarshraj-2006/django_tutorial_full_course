{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-danger">
            Submit
        </button>
    </form>

    {% if form.errors %}
        <div class="alert alert-danger mt-3">
            <ul>
                {% for field in form %}
                    {% for error in field.errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                {% endfor %}
            </ul>
        </div>
    {% endif %}
    <a href="{% url 'notes.list' %}" class="btn btn-secondary mt-3">Back to Notes List</a>

</div>

{% endblock %}
